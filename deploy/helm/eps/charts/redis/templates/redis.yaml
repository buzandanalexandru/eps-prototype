{{- if .Values.enabled }}
{{- $ctx := dict "name" "redis" "ctx" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eps.fullname" $ctx }}
  labels:
    {{- include "eps.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "eps.fullname" $ctx }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "eps.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.image }}
          # A password on top of the NetworkPolicy (security review), from the runtime secret.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.runtimeSecret }}
                  key: REDIS_PASSWORD
                  optional: true
          command: ["sh", "-c"]
          args:
            - >-
              exec redis-server --appendonly yes --appendfsync everysec --dir /data --save "" --protected-mode no
              --maxmemory {{ .Values.maxmemory | quote }} --maxmemory-policy noeviction
              ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not (and .Values.persistence .Values.persistence.enabled) }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if and .Values.persistence .Values.persistence.enabled }}
  # The append-only file on a block-storage volume (step 5 review D-h): it survives a pod being
  # rescheduled, not only a process restart.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eps.fullname" $ctx }}
  labels:
    {{- include "eps.labels" $ctx | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Only the EPS services of this release may reach Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eps.fullname" $ctx }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: eps
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
{{- end }}
