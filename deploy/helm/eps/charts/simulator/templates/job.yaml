{{- if .Values.enabled }}
{{- $ctx := dict "name" "simulator" "ctx" . }}
apiVersion: batch/v1
kind: Job
metadata:
  # Job specs are immutable: one Job per release revision, so `helm upgrade` never patches one.
  name: {{ printf "%s-r%d" (include "eps.fullname" $ctx) .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "eps.labels" $ctx | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "eps.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "eps.podSecurity" $ctx | nindent 6 }}
      containers:
        - name: simulator
          image: {{ include "eps.image" $ctx }}
          env:
            {{- include "eps.env" $ctx | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "eps.containerSecurity" $ctx | nindent 10 }}
{{- end }}
