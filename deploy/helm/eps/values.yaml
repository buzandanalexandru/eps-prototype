# Shared by every sub-chart through .Values.global.
global:
  # Environment slug: "prod" for main, the branch slug for a pull request (deploy/scripts/slug.sh).
  env: dev
  # <load balancer ip>.sslip.io, from deploy/scripts/core-base-domain.sh.
  baseDomain: example.sslip.io
  image:
    registry: ghcr.io/buzandanalexandru
    tag: dev
    pullPolicy: IfNotPresent
  ingress:
    className: traefik
    clusterIssuer: letsencrypt-prod
  # Secret (created by CI in the release namespace) holding DATABASE_URL for this environment's
  # Neon branch, as the service login role (eps_core_login). Never in values files.
  databaseSecret: eps-db
  # Secret (created once per environment by CI) with REDIS_PASSWORD and SNAPSHOT_CACHE_KEY.
  runtimeSecret: eps-runtime
  # Exact browser origins allowed by CORS (no wildcards: any Vercel account can register a project
  # whose URL matches a pattern). Production's web origin here; a preview's exact Vercel URLs are
  # set by CI.
  corsAllowedOrigins: "https://eps-prototype.vercel.app,https://eps-prototype-devblocks.vercel.app"
  # Allowed core-token issuers; empty means "urn:eps:web:<global.env>" (design D0.4).
  tokenIssuers: ""
  # Set by CI to the run id: restarts pods when the database secret changes.
  rolloutId: ""

# Postgres connections: every pod holds its own pgx pool against one Neon compute, so the per-pod
# bound (database.maxConns) times the replicas must stay well under the compute's limit
# (design D0.2). Requests and limits are step-0 sizes; step 12 sets the final ones.
# autoscaling.enabled hands replicas to an HPA (the Deployment then sets no replicas).
core:
  enabled: true
  replicas: 1
  # Checkout, payments and wallet need the order-link key and the providers' keys (eps-runtime).
  paymentSecrets: [ORDER_LINK_KEY, PSP_API_KEY, PSP_ADMIN_TOKEN, PSP_WEBHOOK_SECRET_A, PSP_WEBHOOK_SECRET_B]
  # Step 5: the core verifies waiting-room passes with the gateway's public key only.
  passKeys: [QUEUE_PASS_PUBLIC_KEY]
  # New holds per client per minute and live holds per client (review D-h); 0 turns a limit off.
  holdLimits: { perMinute: 10, live: 10 }
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
  pdb: { enabled: true }
  database: { enabled: true, maxConns: 5 }
  ingress:
    enabled: true
    host: core
    # Requests per second (and burst) to /v1/public/... across all clients of this core host.
    publicRateLimit: { enabled: true, average: 200, burst: 400 }
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

gateway:
  enabled: true
  replicas: 1
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 20, targetCPU: 70 }
  pdb: { enabled: true }
  # The gateway keeps no Postgres pool and its readiness depends only on Redis (the core publishes
  # the token keys and sale settings there).
  database: { enabled: false }
  # Step 5: the gateway signs waiting-room passes (and verifies its own queue tokens).
  passKeys: [QUEUE_PASS_PRIVATE_KEY, QUEUE_PASS_PUBLIC_KEY]
  # Waiting-room joins per client address per minute (design D-5); a /24 gets 20 times this.
  queueJoinsPerMinute: 10
  ingress:
    enabled: true
    host: gw
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

worker:
  enabled: true
  # Two replicas: the singleton loops run on the holder of the worker lease, the other is a hot
  # standby; the order-event consumers run on both (step 5 review).
  replicas: 2
  # The reconciler and instalment runner call the providers; the worker builds the same checkout
  # service as the core, which requires the order-link key outside dev (no webhook keys needed).
  paymentSecrets: [ORDER_LINK_KEY, PSP_API_KEY]
  pdb: { enabled: true }
  database: { enabled: true, maxConns: 3 }
  resources:
    requests: { cpu: 50m, memory: 48Mi }
    limits: { cpu: 500m, memory: 128Mi }

# The simulated payment providers (step 4): charges and knobs in Redis, no database. Their API and
# knobs are in-cluster only; the public pay host serves only their hosted pages (/a/pay/..., /b/pay/...).
pspA:
  enabled: true
  providerId: a
  replicas: 1
  pdb: { enabled: true }
  database: { enabled: false }
  paymentSecrets: [PSP_API_KEY, PSP_ADMIN_TOKEN, PSP_WEBHOOK_SECRET_A]
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
pspB:
  enabled: true
  providerId: b
  replicas: 1
  pdb: { enabled: true }
  database: { enabled: false }
  paymentSecrets: [PSP_API_KEY, PSP_ADMIN_TOKEN, PSP_WEBHOOK_SECRET_B]
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# The public host of the providers' hosted payment pages: pay.<env>.<baseDomain>.
payIngress:
  enabled: true
  host: pay

# A Kubernetes Job; off until a rehearsal is started (step 6). Its name carries the release
# revision, so an upgrade creates a new Job instead of patching an immutable one.
simulator:
  enabled: false
  database: { enabled: true, maxConns: 2 }
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

redis:
  enabled: true
  # Pinned: a floating tag could change Redis under a running sale.
  image: redis:8.4.0
  # About 75% of the memory limit, with noeviction: Redis refuses writes before the kernel kills it.
  maxmemory: 192mb
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # A block-storage volume for the append-only file (production; previews keep an emptyDir).
  persistence: { enabled: false, storageClass: do-block-storage, size: 5Gi }
