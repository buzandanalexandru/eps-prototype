          type: string
          format: uuid
        instances:
          type: array
          items:
            type: object
            required: [instanceId, used]
            properties:
              instanceId:
                type: string
                description: "`<poolId>`, `<poolId>@<date>` or `<poolId>@<date>T<HH:MM>`."
              used:
                type: integer
                format: int64
                description: Units sold plus held.
    ProductAvailability:
      type: object
      required: [productId, status, priceStepIndex, allInMinor]
      properties:
        productId:
          type: string
          format: uuid
        status:
          type: string
          enum: [on_sale, not_yet, ended, sold_out]
