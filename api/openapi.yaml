            $ref: "#/components/schemas/WalletMovement"
    WalletList:
      type: object
      required: [wallets]
      properties:
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/Wallet"
    TopupResult:
      type: object
      required: [attempt]
      properties:
        attempt:
          $ref: "#/components/schemas/PaymentAttempt"
        actionUrl:
          type: string
        wallet:
          $ref: "#/components/schemas/Wallet"
    PaymentResult:
      type: object
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/OrderView"
        actionUrl:
          type: string
          description: The provider page to open (hosted card, wallet sheet or bank challenge).
    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderView"
    OrderView:
      type: object
      required: [id, organiserId, eventId, snapshotVersion, state, currency, totalMinor, lines, holdExpiresAt, serverTime, history, questions, canPay, access, savedCards, buyerKind, payPlan, detailsGiven, answers]
      properties:
        rehearsal:
          type: boolean
          description: A rehearsal order (step 6, simulated fans; kept out of reports).
        id:
          type: string
          format: uuid
        organiserId:
          type: string
        eventId:
          type: string
        snapshotVersion:
          type: integer
        buyerKind:
          type: string
          enum: [account, guest]
        buyerEmail:
          type: string
        buyerName:
          type: string
        locale:
          type: string
        currency:
          type: string
          enum: [RON, EUR]
        state:
          type: string
          enum: [held, paying, payment_failed, paid, issued, expired, cancelled, refunded]
        totalMinor:
          $ref: "#/components/schemas/Money"
        faceMinor:
          $ref: "#/components/schemas/Money"
        fanFeeMinor:
          $ref: "#/components/schemas/Money"
        holdExpiresAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
          description: The core's clock, so the timer counts down from the server deadline.
        payPlan:
          type: string
          enum: [full, instalments]
        answers:
          type: object
          additionalProperties: true
        detailsGiven:
          type: boolean
        saleId:
          type: string
        otpRequired:
          type: boolean
          description: A one-time code must be entered before payment (risk-based OTP, step 5).
        otpVerifiedAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        history:
          type: array
          items:
            type: object
            required: [to, at]
            properties:
              from:
                type: string
              to:
                type: string
              reason:
                type: string
              at:
                type: string
                format: date-time
        eventName:
          $ref: "#/components/schemas/L10n"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        instalmentOffer:
          $ref: "#/components/schemas/InstalmentOffer"
        plan:
          $ref: "#/components/schemas/InstalmentPlan"
        payment:
          $ref: "#/components/schemas/PaymentAttempt"
        canPay:
          type: boolean
          description: The caller may pay now (held or payment failed, the hold live, buyer or a live resume link).
        access:
          type: string
          enum: [buyer, link, view_link, expired_link]
          description: |
            buyer: the order's own buyer; link: a live resume link (may pay by card, Apple Pay or
            Google Pay only); view_link: a guest's order link; expired_link: a resume link after the
            hold ended (state only, no personal details).
        resumeToken:
          type: string
          description: The signed resume link token, until the hold deadline (live orders only).
        ticketsToken:
          type: string
          description: A guest's signed tickets link (step 7), once the order is issued; opens /t/<token>.
        viewToken:
          type: string
          description: A guest's order-link token (30 days).
        wallet:
          type: object
          description: The caller's wallet at this organiser (accounts only).
          required: [balanceMinor, creditMinor]
          properties:
            balanceMinor:
              $ref: "#/components/schemas/Money"
            creditMinor:
              $ref: "#/components/schemas/Money"
        savedCards:
          type: array
          items:
            $ref: "#/components/schemas/SavedCard"
