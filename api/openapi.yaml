openapi: 3.1.0
info:
  title: EPS core API
  version: 0.1.0
  description: |
    The contract between the EPS control plane (Next.js) and the data plane (Go core and gateway).
    This file is the single source: TypeScript types (apps/web/src/lib/core/schema.d.ts) and the Go
    server stubs (services/internal/api/api.gen.go) are generated from it and CI fails on drift.
    Every error is an RFC 9457 problem document with a machine `code` and the `requestId`.
servers:
  - url: https://core.prod.example.sslip.io
    description: Production core (the real host is derived per environment)
security:
  - bearerAuth: []
tags:
  - name: health
  - name: identity
  - name: snapshots
  - name: public
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: 200 while the process runs; never checks dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: 200 when Postgres and Redis answer and the schemas are at the expected versions; 503 naming the failing checks otherwise.
      tags: [health]
      security: []
      parameters:
        - name: verbose
          in: query
          required: false
          description: Include every check, not only the failing ones.
          schema:
            type: boolean
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; `checks` names what failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"
  /v1/version:
    get:
      operationId: getVersion
      summary: Build and schema version of this service
      tags: [health]
      security: []
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  /v1/whoami:
    get:
      operationId: getWhoami
      summary: Echo the verified identity of the caller
      description: Verifies the bearer core token and echoes its claims. 401 without a valid token.
      tags: [identity]
      responses:
        "200":
          description: The verified identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/snapshots/{version}/activate:
    post:
      operationId: activateSnapshot
      summary: Make a published snapshot version the one the core serves
      description: |
        Called by the control plane right after a publish commits (design D3.1, D3.4). The core loads
        the version through the published-only read, checks its hash, caches it and replies with the
        hash. Organiser tokens only; an event of another organiser (or an unknown version) is 404.
      tags: [snapshots]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
      responses:
        "200":
          description: The version is live in the core.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/pool-usage:
    get:
      operationId: getPoolUsage
      summary: Units sold or held per pool instance
      description: |
        The publish gate (design D3.1): units sold plus held per pool instance, from the sales schema.
        Until step 4 creates the sales tables, every instance is unused and the list is empty.
        Only instances with usage are listed. Organiser tokens only; another organiser's event is 404.
      tags: [snapshots]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Usage per pool instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolUsage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public/events/{eventId}/availability:
    get:
      operationId: getAvailability
      summary: Public availability of an event's products
      description: |
        Per visible product of the live snapshot: its sale status, the current price step and its
        all-in amount, and the remaining quantity only when at most 50 or 5% of capacity remain
        (design D3.4), and the day and slot instances that are sold out or have few left. Cached 2
        seconds; no token needed. 404 when the event has no live snapshot (or is off sale).
      tags: [public]
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Availability.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A core token issued by the control plane (EdDSA, audience `eps-core`, at most 5 minutes).
  responses:
    Problem:
      description: An error, as an RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Check:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          description: postgres, redis, schema:sales, schema:control
        ok:
          type: boolean
        detail:
          type: string
          description: Why the check failed (never a secret or connection string).
        expected:
          type: integer
          format: int64
        actual:
          type: integer
          format: int64
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    Version:
      type: object
      required: [service, commit, schemas]
      properties:
        service:
          type: string
          description: Binary name (core, gateway, ...).
        commit:
          type: string
          description: Git commit the image was built from.
        builtAt:
          type: string
        schemas:
          type: object
          description: Applied migration version per schema; absent when the database is unreachable.
          properties:
            control:
              type: integer
              format: int64
            sales:
              type: integer
              format: int64
    Identity:
      type: object
      required: [sub, kind, sid, exp]
      properties:
        sub:
          type: string
          description: User id, or `guest:<id>` for a guest.
        kind:
          type: string
          enum: [organiser, fan, guest]
        org:
          type: string
          description: Active organiser id (organiser tokens only).
        role:
          type: string
          description: The exact membership role (organiser tokens only).
          enum: [owner, admin, box_office, finance, staff]
        sid:
          type: string
        exp:
          type: integer
          format: int64
    Activation:
      type: object
      required: [eventId, version, sha256]
      properties:
        eventId:
          type: string
          format: uuid
        version:
          type: integer
        sha256:
          type: string
    PoolUsage:
      type: object
      required: [eventId, instances]
      properties:
        eventId:
          type: string
          format: uuid
        instances:
          type: array
          items:
            type: object
            required: [instanceId, used]
            properties:
              instanceId:
                type: string
                description: "`<poolId>`, `<poolId>@<date>` or `<poolId>@<date>T<HH:MM>`."
              used:
                type: integer
                format: int64
                description: Units sold plus held.
    ProductAvailability:
      type: object
      required: [productId, status, priceStepIndex, allInMinor]
      properties:
        productId:
          type: string
          format: uuid
        status:
          type: string
          enum: [on_sale, not_yet, ended, sold_out]
        opensAt:
          type: string
          format: date-time
          description: When sales open (status not_yet).
        priceStepIndex:
          type: integer
        allInMinor:
          type: integer
          format: int64
          description: What the fan pays for one unit now, in minor units.
        remaining:
          type: integer
          format: int64
          description: Present only when few are left (at most 50, or at most 5% of capacity).
    Availability:
      type: object
      required: [eventId, version, generatedAt, products, instances]
      properties:
        eventId:
          type: string
          format: uuid
        version:
          type: integer
          description: The live snapshot version the answer comes from.
        generatedAt:
          type: string
          format: date-time
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductAvailability"
        instances:
          type: array
          description: |
            Pool instances (an event pool, a day `<poolId>@<date>` or a slot `<poolId>@<date>T<HH:MM>`)
            that units were taken from and that are sold out or have few left. Instances not listed
            have room; the shop greys out sold-out days and slots and caps its picker by `remaining`.
          items:
            $ref: "#/components/schemas/InstanceAvailability"
    InstanceAvailability:
      type: object
      required: [instanceId, status, remaining]
      properties:
        instanceId:
          type: string
        status:
          type: string
          enum: [on_sale, sold_out]
        remaining:
          type: integer
          format: int64
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code, e.g. `unauthenticated`, `invalid_request`, `not_found`.
        requestId:
          type: string
