openapi: 3.1.0
info:
  title: EPS core API
  version: 0.1.0
  description: |
    The contract between the EPS control plane (Next.js) and the data plane (Go core and gateway).
    This file is the single source: TypeScript types (apps/web/src/lib/core/schema.d.ts) and the Go
    server stubs (services/internal/api/api.gen.go) are generated from it and CI fails on drift.
    Every error is an RFC 9457 problem document with a machine `code` and the `requestId`.
servers:
  - url: https://core.prod.example.sslip.io
    description: Production core (the real host is derived per environment)
security:
  - bearerAuth: []
tags:
  - name: health
  - name: identity
  - name: snapshots
  - name: public
  - name: checkout
  - name: payments
  - name: wallet
  - name: sales
  - name: queue
    description: Served by the gateway (x-eps-service gateway), not the core.
  - name: simulations
    description: Rehearsals and simulator runs (step 6).
  - name: tickets
    description: Tickets, rotating codes, the trip wallet and the fan's data (step 7).
  - name: door
    description: Door devices, the door feed and scans (step 7).
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: 200 while the process runs; never checks dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: 200 when Postgres and Redis answer and the schemas are at the expected versions; 503 naming the failing checks otherwise.
      tags: [health]
      security: []
      parameters:
        - name: verbose
          in: query
          required: false
          description: Include every check, not only the failing ones.
          schema:
            type: boolean
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; `checks` names what failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"
  /v1/version:
    get:
      operationId: getVersion
      summary: Build and schema version of this service
      tags: [health]
      security: []
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  /v1/whoami:
    get:
      operationId: getWhoami
      summary: Echo the verified identity of the caller
      description: Verifies the bearer core token and echoes its claims. 401 without a valid token.
      tags: [identity]
      responses:
        "200":
          description: The verified identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/snapshots/{version}/activate:
    post:
      operationId: activateSnapshot
      summary: Make a published snapshot version the one the core serves
      description: |
        Called by the control plane right after a publish commits (design D3.1, D3.4). The core loads
        the version through the published-only read, checks its hash, caches it and replies with the
        hash. Organiser tokens only; an event of another organiser (or an unknown version) is 404.
      tags: [snapshots]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
      responses:
        "200":
          description: The version is live in the core.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/pool-usage:
    get:
      operationId: getPoolUsage
      summary: Units sold or held per pool instance
      description: |
        The publish gate (design D3.1): units sold plus held per pool instance, from the sales schema.
        Until step 4 creates the sales tables, every instance is unused and the list is empty.
        Only instances with usage are listed. Organiser tokens only; another organiser's event is 404.
      tags: [snapshots]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Usage per pool instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolUsage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public/events/{eventId}/availability:
    get:
      operationId: getAvailability
      summary: Public availability of an event's products
      description: |
        Per visible product of the live snapshot: its sale status, the current price step and its
        all-in amount, and the remaining quantity only when at most 50 or 5% of capacity remain
        (design D3.4), and the day and slot instances that are sold out or have few left. Cached 2
        seconds; no token needed. 404 when the event has no live snapshot (or is off sale).
      tags: [public]
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Availability.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders:
    post:
      operationId: createOrder
      summary: Hold tickets and create an order
      description: |
        Holds the requested quantities from every pool the products draw on, all or nothing, for the
        sale's hold length (design D-7), prices them from snapshot `version` and records the order in
        state `held`. A buyer with a live order for the sale gets that order back (200) and nothing
        more is taken. A repeat with the same Idempotency-Key and body returns the same order.
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Pass"
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The order, held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        "200":
          description: The buyer's existing live order for this sale (or the replayed answer).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listMyOrders
      summary: The caller's orders across organisers, newest first
      tags: [checkout]
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}:
    get:
      operationId: getOrder
      summary: An order's true state
      description: |
        For the order's buyer, or with a valid order link (`X-Order-Token`: a resume token until the
        hold deadline, or a guest's 30-day view token). Paid is shown only after the provider confirmed.
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/details:
    put:
      operationId: setOrderDetails
      summary: Contact details and answers to the checkout questions
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDetails"
      responses:
        "200":
          description: The order with its details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/payments:
    post:
      operationId: payOrder
      summary: Pay an order (one Pay press)
      description: |
        Starts a payment attempt through the simulated providers (card on the provider's hosted page,
        Apple Pay or Google Pay sheet, saved card) or pays from the EPS Wallet in one step. The
        Idempotency-Key is created when the fan presses Pay and reused on retry and double click: a
        repeat returns the same attempt, never a second charge (D-3).
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/Pass"
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRequest"
      responses:
        "200":
          description: The order and, for provider payments, the page to open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel a held or payment-failed order (stock is freed at once)
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
      responses:
        "200":
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/instalments/simulate-next:
    post:
      operationId: simulateNextInstalment
      summary: Demo action - move the plan's clock to its next due date
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
      responses:
        "200":
          description: The order and its plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/instalments/pay-overdue:
    post:
      operationId: payOverdueInstalment
      summary: Pay an overdue instalment now with the plan's saved card
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
      responses:
        "200":
          description: The order and its plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/claims:
    post:
      operationId: claimOrders
      summary: Add guest orders placed with the caller's verified email to the account
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: The claimed orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/saved-cards:
    get:
      operationId: listSavedCards
      summary: The caller's provider-saved cards for one organiser
      tags: [payments]
      parameters:
        - $ref: "#/components/parameters/OrganiserQuery"
      responses:
        "200":
          description: Saved cards (provider, label; never a card number).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedCardList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/saved-cards/{cardId}:
    delete:
      operationId: deleteSavedCard
      summary: Delete a saved card and revoke its provider token
      tags: [payments]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OrganiserQuery"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/wallets:
    get:
      operationId: listWallets
      summary: The caller's EPS Wallet balances, one per organiser (simulated money)
      tags: [wallet]
      responses:
        "200":
          description: Wallets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/wallets/{organiserId}:
    get:
      operationId: getWallet
      summary: The caller's wallet at one organiser, with its history
      tags: [wallet]
      parameters:
        - $ref: "#/components/parameters/OrganiserId"
        - name: currency
          in: query
          required: false
          schema:
            type: string
            enum: [RON, EUR]
      responses:
        "200":
          description: The wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/wallets/{organiserId}/topups:
    post:
      operationId: topUpWallet
      summary: Top up the wallet through the simulated providers
      description: The balance rises only when the provider confirms; the same Idempotency-Key credits once.
      tags: [wallet]
      parameters:
        - $ref: "#/components/parameters/OrganiserId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
        "200":
          description: The top-up's attempt and the provider page to open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/wallets/{organiserId}/topups/{attemptId}:
    get:
      operationId: getTopup
      summary: A top-up's state
      tags: [wallet]
      parameters:
        - $ref: "#/components/parameters/OrganiserId"
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The top-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/payments/providers:
    get:
      operationId: getPaymentProviders
      summary: The organiser's simulated providers - breaker state and live knobs
      tags: [payments]
      responses:
        "200":
          description: Both providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/payments/providers/{provider}/knobs:
    put:
      operationId: setProviderKnobs
      summary: Change a simulated provider's knobs for this organiser (owner or admin)
      tags: [payments]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [a, b]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKnobs"
      responses:
        "200":
          description: Both providers after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/wallets/{organiserId}/pay-code:
    post:
      operationId: createPayCode
      summary: A 6-digit code for one stand payment within 2 minutes
      description: The fan shows the wallet code and this pay code at a stand; the code works once.
      tags: [wallet]
      parameters:
        - $ref: "#/components/parameters/OrganiserId"
        - name: currency
          in: query
          required: false
          schema:
            type: string
            enum: [RON, EUR]
      responses:
        "200":
          description: The codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayCode"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/wallet/stand-payments:
    post:
      operationId: standPayment
      summary: Charge a fan's wallet at a stand (simulated)
      description: Needs the fan's wallet code and current pay code; the same Idempotency-Key charges once.
      tags: [wallet]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandPaymentRequest"
      responses:
        "200":
          description: The fan's wallet after the charge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/wallet/season-close:
    post:
      operationId: closeSeason
      summary: Move every fan's unspent balance to next-season credit (owner or admin)
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonCloseRequest"
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonCloseResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/otp:
    post:
      operationId: sendOrderOtp
      summary: Send (simulate) a one-time code for an order that needs one, or a new code
      description: |
        Risk-based OTP (E12, design D-8): asked only when the organiser switched it on and the buyer
        scored as risky or the order is above the ticket threshold. The code is simulated: it is
        returned here and shown on screen in a "simulated SMS" panel, never sent anywhere.
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
        - $ref: "#/components/parameters/Pass"
        - $ref: "#/components/parameters/Session"
      responses:
        "200":
          description: The simulated code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shop/orders/{orderId}/otp/verify:
    post:
      operationId: verifyOrderOtp
      summary: Check a one-time code (3 tries per code, 3 resends; then the order is cancelled)
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderToken"
        - $ref: "#/components/parameters/Pass"
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 12
      responses:
        "200":
          description: The order, with its code verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/sales:
    get:
      operationId: listSales
      summary: The event's sale moments with their current settings
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Sale moments by opening time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSale
      summary: Add a sale moment to a published event (owner or admin)
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleCreate"
      responses:
        "201":
          description: The sale with version 1 of its settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}:
    delete:
      operationId: deleteSale
      summary: Delete a sale moment before its pre-queue opens (owner or admin)
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getSale
      summary: A sale moment with its settings history and live queue figures
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: The sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}/live:
    patch:
      operationId: patchSaleLive
      summary: Change the live dial, the shopping limit or pause on top of the current version (owner or admin)
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleLiveChange"
      responses:
        "200":
          description: The sale with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}/settings:
    put:
      operationId: updateSaleSettings
      summary: Save a new version of a sale's settings (owner or admin)
      description: |
        Live fields (admission rate, shopping limit, pause, bot defence, OTP, holds and caps) take
        effect within 2 seconds. Opening time, pre-queue window and queue on/off are refused with
        EPS-SALE-LOCKED once the pre-queue opened. With baseVersion, a save on top of an older
        version is refused with EPS-SALE-STALE (409).
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/SaleId"
        - name: baseVersion
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleSettings"
      responses:
        "200":
          description: The sale with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/queue/{saleId}/join:
    post:
      operationId: joinQueue
      x-eps-service: gateway
      summary: Join a sale's waiting room (gateway)
      description: |
        Takes the fan's one place per account (or guest identity), or returns the place it has. Before
        the pre-queue opens nothing is taken; in the pre-queue window the fan waits for the draw at
        opening; after the draw the fan joins the back of the line; with the queue off a pass is ready
        at once. The page sends a session secret it created (X-EPS-Session) and a proof of work:
        SHA-256 of "<saleId>:<sha256(session) hex>:<pow>" with 16 leading zero bits.
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/SaleId"
        - $ref: "#/components/parameters/SessionRequired"
        - $ref: "#/components/parameters/Tab"
        - name: X-EPS-Client-UA
          in: header
          required: false
          description: The browser's user agent, passed on by the web app.
          schema:
            type: string
            maxLength: 400
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pow:
                  type: string
                  maxLength: 64
                print:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: The fan's place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/queue/{saleId}/status:
    get:
      operationId: queueStatus
      x-eps-service: gateway
      summary: A place's position, estimate and, once admitted, its pass (gateway)
      description: Needs only the queue token and the session secret it is bound to (no core token).
      tags: [queue]
      security: []
      parameters:
        - $ref: "#/components/parameters/Tab"
        - $ref: "#/components/parameters/SaleId"
        - $ref: "#/components/parameters/SessionRequired"
        - name: X-EPS-Queue-Token
          in: header
          required: true
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: The place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}/degrade:
    patch:
      operationId: setSaleDegraded
      summary: Turn degraded mode on or off (owner or admin)
      description: |
        Degraded mode (step 6, E11): new holds are refused with EPS-BUSY (503, Retry-After 30), the
        waiting room admits no one while keeping every place, held orders can still pay, and the
        shop's availability answer says degraded so event pages show the busy message. Takes
        effect within 10 seconds each way.
      tags: [sales]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [degraded]
              properties:
                degraded:
                  type: boolean
      responses:
        "200":
          description: The sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}/rehearsals:
    get:
      operationId: listRehearsals
      summary: The live rehearsals of a sale moment, with the simulator's limits
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: The rehearsals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehearsalList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRehearsal
      summary: Copy a sale moment into a rehearsal with its own event id and stock (owner or admin)
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "201":
          description: The rehearsal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}/rehearsal/reset:
    post:
      operationId: resetRehearsal
      summary: Replace a rehearsal with a fresh one (full stock, empty queue); refused during a run
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "201":
          description: The fresh rehearsal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleView"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/sales/{saleId}/simulations:
    get:
      operationId: listSimulations
      summary: The latest runs on a rehearsal
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/SimulationRun"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startSimulation
      summary: Start a simulator run on a rehearsal (owner or admin)
      description: |
        Refused for a sale that is not a rehearsal, with knobs out of range (EPS-SIM-INVALID naming
        the field), and while a run is active for the organiser or the sale (EPS-SIM-ACTIVE naming
        it) or anywhere in the environment (EPS-SIM-BUSY). A rehearsal that already had a run is
        replaced by a fresh one first, so every run starts with full stock and an empty queue.
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationKnobs"
      responses:
        "201":
          description: The run (pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/simulations/{runId}:
    get:
      operationId: getSimulation
      summary: One run with its latest report and, once ended, its summary
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/simulations/{runId}/stop:
    post:
      operationId: stopSimulation
      summary: Stop a run (its traffic ends within 15 seconds)
      tags: [simulations]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/live/{saleId}:
    get:
      operationId: liveStream
      x-eps-service: gateway
      summary: The live on-sale frames of a sale as server-sent events (gateway; the sale's organiser only)
      description: |
        Opened by the dashboard straight from the browser with an organiser core token in the
        Authorization header (fetch, not EventSource). Sends `retry: 2000`, an `event: history`
        with up to 900 compact points, the latest frame, then one `event: frame` per second with
        `id` = its timestamp, and a comment every 15 seconds.
      tags: [queue]
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /v1/ticket-keys:
    get:
      operationId: getTicketKeys
      summary: The public keys that verify ticket codes
      description: |
        Every key id with its Ed25519 public key (raw 32 bytes, base64url) and validity (step 7, design
        D3). An old key stays listed until every event signed with it has ended. No private material.
        Door devices cache this set and verify codes offline; `serverTime` lets them correct their clock.
      tags: [tickets]
      security: []
      responses:
        "200":
          description: The key set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketKeys"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/trip:
    get:
      operationId: getMyTrip
      summary: The caller's trip wallet across organisers
      description: Every ticket the caller holds now and the paid orders still being issued, grouped by event, ordered by event start.
      tags: [tickets]
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/tickets/{ticketId}:
    get:
      operationId: getMyTicket
      summary: One ticket the caller holds, with its event
      description: Not found for anyone but the holder; the holder before the last reissue gets 410 EPS-TICKET-MOVED.
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: The ticket in its event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/tickets/{ticketId}/codes:
    get:
      operationId: getMyTicketCodes
      summary: Signed entry codes for the current window and the next 39 (10 minutes)
      description: |
        Only to the ticket's current holder, for its current generation (design D4). A suspended,
        cancelled or unnamed (named product) ticket gets 409 with its code; anyone else 404.
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: The code buffer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCodes"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/tickets/{ticketId}/name:
    put:
      operationId: nameMyTicket
      summary: Name a ticket before its personalisation deadline
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketNameRequest"
      responses:
        "200":
          description: The ticket in its event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/tickets/{ticketId}/check-in:
    post:
      operationId: checkInMyTicket
      summary: Check a ticket in online (free until the deadline, then the late fee from the EPS Wallet)
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "200":
          description: The ticket in its event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/tickets/{ticketId}/pick-day:
    post:
      operationId: pickMyTicketDay
      summary: Pick the day of a flexible day ticket (a reissue; final)
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickDayRequest"
      responses:
        "200":
          description: The ticket in its event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/erase:
    post:
      operationId: eraseMyData
      summary: Delete the caller's personal sales data (GDPR)
      description: |
        Across organisers: orders and payments lose the person's id, name, email and answers (amounts
        and states stay, anonymised, as the law requires), held tickets are cancelled, wallets and
        saved cards lose their owner, waiting-room audit rows are deleted. Refused while an order is
        in progress. Accounts only.
      tags: [tickets]
      responses:
        "200":
          description: What was erased (counts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erased"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ticket-links/{linkToken}:
    get:
      operationId: getTicketLink
      summary: A guest order's tickets through its signed link
      description: The link is order-scoped and signed; a changed or expired link is 404 EPS-LINK-NOT-VALID, a claimed order 410.
      tags: [tickets]
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: The order's tickets in their event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ticket-links/{linkToken}/tickets/{ticketId}/codes:
    get:
      operationId: getTicketLinkCodes
      summary: Codes of a ticket through its order's signed link
      tags: [tickets]
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: The code buffer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCodes"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ticket-links/{linkToken}/tickets/{ticketId}/name:
    put:
      operationId: nameTicketLink
      summary: Name a ticket through its order's signed link
      tags: [tickets]
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketNameRequest"
      responses:
        "200":
          description: The ticket in its event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/door/devices:
    post:
      operationId: registerDoorDevice
      summary: Register a door device for an event at a gate
      description: Owner, admin or box office of the event's organiser; anyone else 404.
      tags: [door]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoorDeviceRequest"
      responses:
        "201":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoorDevice"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/door-sync:
    get:
      operationId: doorSync
      summary: The event's door feed since a cursor, or a manifest page while preparing
      description: |
        Revocations, suspensions and their lifting, entries by other devices, conflicts and manifest
        changes in sequence order after `since` (at most 1,000; `more` when there are others), with the
        server time. With `manifest=true`: a page of 2,000 tickets after `after` and the cursor to sync
        from. Owner, admin or box office of the event's organiser; anyone else 404.
      tags: [door]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: manifest
          in: query
          required: false
          schema:
            type: boolean
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 36
        - name: device
          in: query
          required: false
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: The sync package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoorSync"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organiser/events/{eventId}/door/scans:
    post:
      operationId: uploadDoorScans
      summary: Upload a device's scans (idempotent by scan id; first entry by device time wins)
      tags: [door]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoorScansRequest"
      responses:
        "200":
          description: The decision on each scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoorScansResult"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkToken:
      name: linkToken
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 400
        pattern: "^[A-Za-z0-9_.-]+$"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Pass:
      name: X-EPS-Pass
      in: header
      required: false
      description: The waiting room's signed pass (required on sales with a waiting room).
      schema:
        type: string
        maxLength: 2048
    Session:
      name: X-EPS-Session
      in: header
      required: false
      description: The browser's session secret the pass is bound to.
      schema:
        type: string
        maxLength: 200
    Tab:
      name: X-EPS-Tab
      in: header
      required: false
      description: The page's tab id (polling is scored per tab).
      schema:
        type: string
        maxLength: 16
    SessionRequired:
      name: X-EPS-Session
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganiserId:
      name: organiserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganiserQuery:
      name: organiserId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    OrderToken:
      name: X-Order-Token
      in: header
      required: false
      description: A signed order link (resume or view token); the order's buyer does not need one.
      schema:
        type: string
        maxLength: 400
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,100}$"
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Created when the fan presses the button; reused on retry and double click.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,100}$"
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A core token issued by the control plane (EdDSA, audience `eps-core`, at most 5 minutes).
  responses:
    Problem:
      description: An error, as an RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    TicketKeys:
      type: object
      required: [keys, serverTime]
      properties:
        serverTime:
          type: string
          format: date-time
        windowSeconds:
          type: integer
        keys:
          type: array
          items:
            type: object
            required: [keyId, publicKey, validFrom, validTo]
            properties:
              keyId:
                type: integer
                minimum: 1
                maximum: 255
              publicKey:
                type: string
              validFrom:
                type: string
                format: date-time
              validTo:
                type: [string, "null"]
                format: date-time
    TicketItem:
      type: object
      required: [id, organiserId, eventId, orderId, productId, generation, state, holderKind, productType, productName, needsName, named, nameLocked, snapshotVersion, lineNo, unitNo, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organiserId:
          type: string
        eventId:
          type: string
        orderId:
          type: string
        lineNo:
          type: integer
        unitNo:
          type: integer
        productId:
          type: string
        instance:
          type: string
        snapshotVersion:
          type: integer
        generation:
          type: integer
        holderKind:
          type: string
        state:
          type: string
          enum: [valid, suspended, cancelled]
        cancelReason:
          type: string
        holderName:
          type: string
        pickedDay:
          type: string
        checkedInAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        productType:
          type: string
        productName:
          $ref: "#/components/schemas/L10n"
        zone:
          type: [string, "null"]
        startsAt:
          type: string
          format: date-time
        day:
          type: string
        needsName:
          type: boolean
        named:
          type: boolean
        nameLocked:
          type: boolean
        personaliseBy:
          type: string
          format: date-time
        checkinBy:
          type: string
          format: date-time
        lateCheckinFeeMinor:
          type: integer
          format: int64
        pickDays:
          type: array
          items:
            type: string
        overdue:
          type: object
          required: [amountMinor]
          properties:
            amountMinor:
              type: integer
              format: int64
            graceUntil:
              type: string
    TripEvent:
      type: object
      required: [eventId, organiserId, brandId, name, startsAt, endsAt, timezone, currency, isSample, items, pending]
      properties:
        eventId:
          type: string
        organiserId:
          type: string
        brandId:
          type: string
        name:
          $ref: "#/components/schemas/L10n"
        startsAt:
          type: string
        endsAt:
          type: string
        timezone:
          type: string
        venue:
          type: object
          additionalProperties: true
        currency:
          type: string
        isSample:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketItem"
        pending:
          type: array
          items:
            type: object
            required: [orderId, lines]
            properties:
              orderId:
                type: string
              lines:
                type: array
                items:
                  type: object
                  required: [productId, productName, qty]
                  properties:
                    productId:
                      type: string
                    productName:
                      $ref: "#/components/schemas/L10n"
                    qty:
                      type: integer
    Trip:
      type: object
      required: [serverTime, events]
      properties:
        serverTime:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/TripEvent"
    TicketCodes:
      type: object
      required: [serverTime, ticketId, generation, windowSeconds, codes]
      properties:
        serverTime:
          type: string
          format: date-time
        ticketId:
          type: string
        generation:
          type: integer
        windowSeconds:
          type: integer
        codes:
          type: array
          maxItems: 40
          items:
            type: object
            required: [window, validAt, expiresAt, code]
            properties:
              window:
                type: integer
                format: int64
              validAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              code:
                type: string
    TicketNameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    CheckInRequest:
      type: object
      additionalProperties: false
      properties:
        payLate:
          type: boolean
          description: Pay the late check-in fee from the EPS Wallet when the deadline has passed.
    PickDayRequest:
      type: object
      required: [day]
      additionalProperties: false
      properties:
        day:
          type: string
          format: date
    Erased:
      type: object
      required: [organisers, orders, tickets, wallets, savedCards, queueEntries]
      properties:
        organisers:
          type: integer
        orders:
          type: integer
        tickets:
          type: integer
        wallets:
          type: integer
        savedCards:
          type: integer
        queueEntries:
          type: integer
    DoorDeviceRequest:
      type: object
      required: [gate]
      additionalProperties: false
      properties:
        gate:
          type: string
          minLength: 1
          maxLength: 60
    DoorDevice:
      type: object
      required: [deviceId, eventId, gate]
      properties:
        deviceId:
          type: string
        eventId:
          type: string
        gate:
          type: string
    DoorSync:
      type: object
      required: [serverTime, eventId, cursor, more, feed]
      properties:
        serverTime:
          type: string
          format: date-time
        eventId:
          type: string
        cursor:
          type: integer
          format: int64
        more:
          type: boolean
        feed:
          type: array
          items:
            type: object
            required: [seq, kind, ticketId, data, at]
            properties:
              seq:
                type: integer
                format: int64
              kind:
                type: string
                enum: [revoked, suspended, lifted, entry, conflict, manifest]
              ticketId:
                type: string
              generation:
                type: integer
              data:
                type: object
                additionalProperties: true
              at:
                type: string
                format: date-time
        manifest:
          type: array
          items:
            type: object
