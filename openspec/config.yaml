schema: spec-driven

context: |
  EPS Prototype: a next-generation ticketing platform for the NIBIRU / EPS CTO challenge
  (48-hour prototype, a demo video of at most 5 minutes, a vision of at most one page).
  The platform is open to EVERY event organiser: each organiser has an admin dashboard with a
  ticketing-system builder to customise and rebrand (white-label) the shared platform.
  NIBIRU is only the first organiser; never hard-code an organiser.
  Research lives in docs/research/ (the NIBIRU/EPS teardown and competitor reports). Read only the sections a change needs.
  CLI: OpenSpec is a pinned dev dependency (1.16.0). Run it as `npx openspec ...`. Never run
  `openspec feedback`, `openspec install` or `openspec update`.
  OpenSpec workflows never commit or push; the session does that after a change is archived.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
