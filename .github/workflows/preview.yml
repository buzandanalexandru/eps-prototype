name: preview

# Every pull request gets its own environment (design D0.6): the PR's Go images on DOKS in
# namespace eps-<slug>, a Neon branch preview/<branch> with both schemas migrated, and the Vercel
# preview (built by Vercel's Git integration). Playwright then runs against the deployed preview.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: read
  statuses: read

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: odd-sun-50771070
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BRANCH: ${{ github.head_ref }}
  SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required secrets are present
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: deploy/scripts/require-secrets.sh DIGITALOCEAN_ACCESS_TOKEN NEON_API_KEY

  images:
    needs: secrets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [core, gateway, worker, fakepsp, simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services
          target: ${{ matrix.binary }}
          push: true
          tags: ${{ env.REGISTRY }}/eps-${{ matrix.binary }}:${{ env.SHA }}
          build-args: |
            COMMIT=${{ env.SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}

  database:
    needs: secrets
    runs-on: ubuntu-latest
    outputs:
      branch_id: ${{ steps.neon.outputs.branch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: Get or create the Neon branch (waits for the Vercel integration first)
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: deploy/scripts/neon-branch.sh get-or-create "preview/$BRANCH" 300
      - name: Migrate both schemas
        working-directory: services
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url_unpooled }}
        run: go run ./cmd/migrate -control ../apps/web/db/migrations

  deploy-core:
    needs: [images, database]
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.vars.outputs.slug }}
      core_url: ${{ steps.vars.outputs.core_url }}
      gateway_url: ${{ steps.vars.outputs.gateway_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kube
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Cluster add-ons (first run only; cluster-bootstrap.yml can re-run them)
        run: |
          if ! kubectl get namespace traefik >/dev/null 2>&1; then deploy/cluster/addons.sh; fi
      - name: Environment names
        id: vars
        run: |
          slug=$(deploy/scripts/slug.sh "$BRANCH")
          base=$(deploy/scripts/core-base-domain.sh)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "core_url=https://core.$slug.$base" >> "$GITHUB_OUTPUT"
          echo "gateway_url=https://gw.$slug.$base" >> "$GITHUB_OUTPUT"
      - name: Database URL secret for the namespace
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          export NEON_OUTPUT_FILE="$RUNNER_TEMP/neon.env"
          deploy/scripts/neon-branch.sh get-or-create "preview/$BRANCH" 0 > /dev/null
          url=$(grep '^database_url_unpooled=' "$NEON_OUTPUT_FILE" | tail -1 | cut -d= -f2-)
          rm -f "$NEON_OUTPUT_FILE"
          ns="eps-${{ steps.vars.outputs.slug }}"
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$ns" create secret generic eps-db --from-literal=DATABASE_URL="$url" \
            --dry-run=client -o yaml | kubectl apply -f - > /dev/null
      - name: helm upgrade --install (atomic)
        run: |
          slug=${{ steps.vars.outputs.slug }}
          helm upgrade --install "eps-$slug" deploy/helm/eps \
            --namespace "eps-$slug" \
            -f deploy/helm/eps/values-preview.yaml \
            --set global.env="$slug" \
            --set global.baseDomain="${{ steps.vars.outputs.base }}" \
            --set global.image.registry="$REGISTRY" \
            --set global.image.tag="$SHA" \
            --atomic --wait --timeout 10m
      - name: Core answers over HTTPS
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${{ steps.vars.outputs.core_url }}/healthz"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::The preview core did not answer over HTTPS within 10 minutes (certificate or ingress)."
          kubectl -n "eps-${{ steps.vars.outputs.slug }}" get pods,ingress,certificate || true
          exit 1

  e2e:
    needs: deploy-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel preview of this commit
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.SHA;
            for (let i = 0; i < 90; i++) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner, repo: context.repo.repo, sha, per_page: 20,
              });
              for (const d of deployments.filter((d) => !/production/i.test(d.environment))) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: d.id, per_page: 5,
                });
                const ok = statuses.find((s) => s.state === "success");
                if (ok) { core.setOutput("url", ok.environment_url || ok.target_url); return; }
                if (statuses.some((s) => s.state === "failure" || s.state === "error")) {
                  core.setFailed(`Vercel preview deployment failed: ${statuses[0].target_url}`); return;
                }
              }
              await new Promise((r) => setTimeout(r, 10000));
            }
            core.setFailed("No successful Vercel preview deployment for this commit after 15 minutes. Is the Vercel project linked to the repository?");
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright against the deployed preview
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.url }}
          CORE_URL: ${{ needs.deploy-core.outputs.core_url }}
          EXPECT_WEB_COMMIT: ${{ env.SHA }}
          EXPECT_CORE_COMMIT: ${{ env.SHA }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Comment the preview addresses on the pull request
        if: always() && steps.vercel.outputs.url
        uses: actions/github-script@v7
        env:
          WEB_URL: ${{ steps.vercel.outputs.url }}
          CORE_URL: ${{ needs.deploy-core.outputs.core_url }}
          GATEWAY_URL: ${{ needs.deploy-core.outputs.gateway_url }}
        with:
          script: |
            const marker = "<!-- eps-preview -->";
            const body = [
              marker,
              "### Preview environment",
              "",
              `| | |`, `|---|---|`,
              `| Web | ${process.env.WEB_URL} |`,
              `| Status | ${process.env.WEB_URL}/status |`,
              `| Core | ${process.env.CORE_URL} |`,
              `| Gateway | ${process.env.GATEWAY_URL} |`,
              `| Commit | \`${process.env.SHA}\` |`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
