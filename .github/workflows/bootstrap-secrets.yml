name: bootstrap-secrets

# Generates BETTER_AUTH_SECRET once per Vercel environment (design D0.6). Existing values are kept;
# no value is ever printed. Needs the VERCEL_TOKEN Actions secret (an owner account action).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: deploy/scripts/require-secrets.sh VERCEL_TOKEN
      - name: BETTER_AUTH_SECRET per environment (created only when missing)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for target in production preview development; do
            deploy/scripts/vercel-env.sh create-secret-if-missing BETTER_AUTH_SECRET "$target"
          done
