name: preview-cleanup

# On close or merge: remove the pull request's Go environment and its Neon branch (design D0.6).
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  NEON_PROJECT_ID: odd-sun-50771070
  BRANCH: ${{ github.head_ref }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required secrets are present
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: deploy/scripts/require-secrets.sh DIGITALOCEAN_ACCESS_TOKEN NEON_API_KEY
      - uses: ./.github/actions/kube
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Uninstall the release and delete the namespace
        run: |
          slug=$(deploy/scripts/slug.sh "$BRANCH")
          [[ "$slug" != "prod" ]] || { echo "Refusing to clean up production."; exit 1; }
          helm uninstall "eps-$slug" --namespace "eps-$slug" --wait || echo "release already gone"
          kubectl delete namespace "eps-$slug" --ignore-not-found --wait=true
          ! kubectl get namespace "eps-$slug" 2>/dev/null
      - name: Delete the Neon branch if the integration left it
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          sleep 60 # give the Neon-Vercel integration the first chance
          deploy/scripts/neon-branch.sh delete-if-exists "preview/$BRANCH"
